name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/dependabot.yml"]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Снять скриншоты для README
        type: boolean
        default: true

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests
        run: swift test

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Demo folder
        run: python3 scripts/make_demo_tree.py "$RUNNER_TEMP/Мои файлы"

      # Launches the app the way a folder dropped on its Dock icon does and checks that a window
      # opens and shows the scanned folder.
      - name: Smoke test
        run: |
          mkdir -p shots
          open -W --stdout shots/open.log --stderr shots/open.log -a "$PWD/build/SpaceMap.app" "$RUNNER_TEMP/Мои файлы" \
            --args --snapshot "$PWD/shots/map.png" --delay 6 --logical --hover
          cat shots/open.log
          grep -q "snapshot: saved" shots/open.log
          grep -q "files=9267 " shots/open.log

      # AppKit reads arguments as "-key value" pairs, so flags without a value go last.
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          APP_BIN="$PWD/build/SpaceMap.app/Contents/MacOS/SpaceMap"
          DEMO="$RUNNER_TEMP/Мои файлы"
          "$APP_BIN" --snapshot "$PWD/shots/welcome.png" --delay 4
          "$APP_BIN" --scan "$DEMO" --snapshot "$PWD/shots/types.png" --delay 6 --tab types --focus video --logical
          "$APP_BIN" --scan "$DEMO" --snapshot "$PWD/shots/largest.png" --delay 6 --tab largest --logical

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpaceMap-macOS
          path: build/SpaceMap-macOS.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: shots/
