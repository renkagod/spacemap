name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/dependabot.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/dependabot.yml"]
  workflow_dispatch:
    inputs:
      screenshots:
        description: Take the README screenshots
        type: boolean
        default: true

permissions: {}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests
        run: swift test

      - name: Build app
        run: bash scripts/build-app.sh

      # The same tree with English and Russian names.
      - name: Demo folders
        run: |
          python3 scripts/make_demo_tree.py --lang en "$RUNNER_TEMP/My Files"
          python3 scripts/make_demo_tree.py --lang ru "$RUNNER_TEMP/Мои файлы"

      # Launches the app the way a folder dropped on its Dock icon does and checks that a window
      # opens and shows the scanned folder, once per interface language.
      - name: Smoke test
        run: |
          mkdir -p shots
          open -W --stdout shots/open-en.log --stderr shots/open-en.log -a "$PWD/build/SpaceMap.app" "$RUNNER_TEMP/My Files" \
            --args --snapshot "$PWD/shots/smoke-en.png" --delay 6 --logical --hover
          open -W --stdout shots/open-ru.log --stderr shots/open-ru.log -a "$PWD/build/SpaceMap.app" "$RUNNER_TEMP/Мои файлы" \
            --args -Language ru --snapshot "$PWD/shots/smoke-ru.png" --delay 6 --logical --hover
          for log in shots/open-en.log shots/open-ru.log; do
            cat "$log"
            grep -q "snapshot: saved" "$log"
            grep -q "files=9267 " "$log"
          done

      # AppKit reads arguments as "-key value" pairs, so flags without a value go last.
      - name: Screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        run: |
          APP_BIN="$PWD/build/SpaceMap.app/Contents/MacOS/SpaceMap"
          shoot() {
            local language=$1 demo=$2
            mkdir -p "shots/$language"
            "$APP_BIN" -Language "$language" --snapshot "$PWD/shots/$language/welcome.png" --delay 4
            "$APP_BIN" -Language "$language" --scan "$demo" --snapshot "$PWD/shots/$language/map.png" --delay 6 --logical --hover
            "$APP_BIN" -Language "$language" --scan "$demo" --snapshot "$PWD/shots/$language/types.png" --delay 6 --tab types --focus video --logical
            "$APP_BIN" -Language "$language" --scan "$demo" --snapshot "$PWD/shots/$language/largest.png" --delay 6 --tab largest --logical
          }
          shoot en "$RUNNER_TEMP/My Files"
          shoot ru "$RUNNER_TEMP/Мои файлы"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpaceMap-macOS
          path: build/SpaceMap-macOS.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: shots/
