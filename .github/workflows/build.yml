name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Tests
        run: swift test

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Screenshots
        run: |
          APP_BIN="$PWD/build/SpaceMap.app/Contents/MacOS/SpaceMap"
          mkdir -p shots

          DEMO="$RUNNER_TEMP/Мои файлы"
          python3 scripts/make_demo_tree.py "$DEMO"

          "$APP_BIN" --snapshot "$PWD/shots/welcome.png" --delay 4 || true
          # `open -a App folder` launches the app the way a folder dropped on its Dock icon does.
          # AppKit reads arguments as "-key value" pairs, so flags without a value go last.
          open -W --stdout "$PWD/shots/open.log" --stderr "$PWD/shots/open.log" -a "$PWD/build/SpaceMap.app" "$DEMO" \
            --args --snapshot "$PWD/shots/map.png" --delay 8 --logical --hover || true
          cat shots/open.log || true
          "$APP_BIN" --scan "$DEMO" --snapshot "$PWD/shots/types.png" --delay 8 --tab types --focus video --logical || true
          "$APP_BIN" --scan "$DEMO" --snapshot "$PWD/shots/largest.png" --delay 8 --tab largest --logical || true
          "$APP_BIN" --scan "$HOME" --snapshot "$PWD/shots/home.png" --delay 25 --hover || true
          ls -la shots

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SpaceMap-macOS
          path: build/SpaceMap-macOS.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: shots/
